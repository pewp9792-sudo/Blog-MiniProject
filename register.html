<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .register-card {
      width: 420px;
      max-width: 100%;
      border: none;
      background: #fff;
      border-radius: 20px;
    }

    .form-control {
      border-radius: 12px;
      border: 1px solid #e2e6ea;
      padding-left: 45px;
      height: 45px;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.15);
    }

    .form-control.rq {
      border-color: #dc3545;
    }

    .form-control.focused {
      border-color: #0d6efd;
    }

    .icon-left {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
      font-size: 18px;
    }

    .icon-right {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6c757d;
      font-size: 18px;
    }

    .btn-primary {
      border-radius: 12px;
      font-weight: 600;
      height: 45px;
    }

    .my-toast-error,
    .my-toast-success {
      position: fixed;
      top: 20px;
      right: 20px;
      display: none;
      min-width: 250px;
      z-index: 9999;
    }

    p {
      color: #dc3545;
      font-size: 12px;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100 px-3">
    <div class="register-card shadow-lg p-4">
      <h3 class="text-center text-primary fw-semibold mb-4">Register</h3>

      <form>
        <!-- First Name -->
        <div class="form-group">
          <label class="form-label fw-medium">First Name</label>
          <div class="position-relative">
            <input type="text" id="fname" class="form-control" placeholder="Enter your first name">
            <i class="bi bi-person icon-left"></i>
          </div>
          <p></p>
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label class="form-label fw-medium">Last Name</label>
          <div class="position-relative">
            <input type="text" id="lname" class="form-control" placeholder="Enter your last name">
            <i class="bi bi-person icon-left"></i>
          </div>
          <p></p>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label fw-medium">Email</label>
          <div class="position-relative">
            <input type="email" id="email" class="form-control" placeholder="Enter your email">
            <i class="bi bi-envelope icon-left"></i>
          </div>
          <p></p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label fw-medium">Password</label>
          <div class="position-relative">
            <input type="password" id="password" class="form-control" placeholder="Enter your password">
            <i class="bi bi-lock icon-left"></i>
            <i class="bi bi-eye icon-eye icon-right" class="icon-eye"></i>
          </div>
          <p></p>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label fw-medium">Confirm Password</label>
          <div class="position-relative">
            <input type="password" id="cpassword" class="form-control" placeholder="Confirm your password">
            <i class="bi bi-lock icon-left"></i>
          </div>
          <p></p>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>

      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1">
        <span class="mx-2 text-muted small">OR</span>
        <hr class="flex-grow-1">
      </div>

      <p class="text-center small mb-0">
        Already have an account?
        <a href="index.html" class="fw-semibold text-primary text-decoration-none">Login</a>
      </p>
    </div>
  </div>

  <!-- Toast -->
  <div class="my-toast-error alert alert-danger rounded-3">Registration failed!</div>
  <div class="my-toast-success alert alert-success rounded-3">Registered successfully!</div>

  <script src="assets/Js/BaseURL.js"></script>
  <script src="assets/Js/register.js"></script>
  <script>
    // Toggle password eye
    document.querySelectorAll(".icon-eye").forEach((eye) => {
      eye.onclick = () => {
        const input = eye.parentElement.querySelector("input");
        input.type = input.type === "password" ? "text" : "password";
        eye.classList.toggle("bi-eye");
        eye.classList.toggle("bi-eye-slash");
      };
    });
  </script>
</body>
</html>
