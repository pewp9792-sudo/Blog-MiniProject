<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-card {
      width: 420px;
      max-width: 100%;
      border: none;
      background: #fff;
      border-radius: 20px;
    }

    .form-control {
      border-radius: 12px;
      border: 1px solid #e2e6ea;
      padding-left: 45px;
      height: 45px;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.15);
    }

    .form-control.is-invalid {
      border-color: #dc3545;
    }

    .form-control.is-invalid:focus {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.15rem rgba(220, 53, 69, 0.25);
    }

    .icon-left {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
      font-size: 18px;
    }

    .icon-right {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6c757d;
      font-size: 18px;
    }

    .btn-primary {
      border-radius: 12px;
      font-weight: 600;
      height: 45px;
      background: linear-gradient(135deg, #0d6efd, #5c63f5);
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0b5ed7, #4a56d4);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .my-toast-error,
    .my-toast-success {
      position: fixed;
      top: 20px;
      right: 20px;
      display: none;
      min-width: 300px;
      z-index: 9999;
      border-radius: 12px;
      font-weight: 500;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100 px-3">
    <div class="login-card shadow-lg p-4">
      <h3 class="text-center text-primary fw-semibold mb-4">Login</h3>

      <form>
        <!-- Email -->
        <label class="form-label fw-medium">Email</label>
        <div class="position-relative mb-3">
          <input type="email" id="email" class="form-control" placeholder="Enter your email">
          <i class="bi bi-envelope icon-left"></i>
        </div>

        <!-- Password -->
        <label class="form-label fw-medium">Password</label>
        <div class="position-relative mb-3">
          <input type="password" id="password" class="form-control" placeholder="Enter your password">
          <i class="bi bi-lock icon-left"></i>
          <i class="bi bi-eye icon-right" id="togglePassword"></i>
        </div>

        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>

      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1">
        <span class="mx-2 text-muted small">OR</span>
        <hr class="flex-grow-1">
      </div>

      <p class="text-center small mb-0">
        Don't have an account?
        <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register</a>
      </p>
    </div>
  </div>

  <!-- Toast -->
  <div class="my-toast-error alert alert-danger rounded-3">Login failed!</div>
  <div class="my-toast-success alert alert-success rounded-3">Login success!</div>

  <script src="assets/Js/BaseURL.js"></script>
  <script src="assets/Js/login.js"></script>
  <script>
    // Toggle password eye
    const toggle = document.getElementById("togglePassword");
    const password = document.getElementById("password");

    toggle.addEventListener("click", () => {
      const type = password.type === "password" ? "text" : "password";
      password.type = type;
      toggle.classList.toggle("bi-eye");
      toggle.classList.toggle("bi-eye-slash");
    });
  </script>
</body>
</html>
