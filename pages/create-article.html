<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article - Blog Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="menu-icon" id="menuToggle">
                <i class="bi bi-list"></i>
            </div>
            <div class="sidebar-title">Blog</div>
        </div>

        <div class="admin-label">ADMIN</div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active" id="myArticleLink">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>My Article</span>
                    <i class="bi bi-chevron-down dropdown-icon"></i>
                </a>
                <ul class="sub-menu show" id="articleSubmenu">
                    <li class="nav-item">
                        <a href="my-articles.html" class="nav-link">All Article</a>
                    </li>
                    <li class="nav-item">
                        <a href="create-article.html" class="nav-link active">Create Article</a>
                    </li>
                </ul>
            </li>
            <li class="nav-item">
                <a href="categories.html" class="nav-link">
                    <i class="bi bi-tag"></i>
                    <span>Category</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="profile.html" class="nav-link">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </li>
            <li class="nav-item" style="margin-top: 30px;">
                <a href="#" class="nav-link logout-link" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="page-title">Create Article</div>
            <div class="user-profile" id="userProfile">
                <span class="user-name" id="userName">Loading...</span>
                <div class="user-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <i class="bi bi-chevron-down"></i>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="form-container">
                <div class="form-header">
                    <h1 class="form-title">Create New Article</h1>
                    <a href="my-articles.html" class="btn-back">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>

                <form id="createArticleForm" class="article-form">
                    <div class="form-row">
                        <div class="form-group col-md-8">
                            <label for="title">Article Title *</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="Enter article title" required>
                        </div>
                        
                        <div class="form-group col-md-4">
                            <label for="category">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Select Category</option>
                                <!-- Categories will be loaded here -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief description of your article" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="content">Content *</label>
                        <textarea class="form-control" id="content" name="content" rows="10" placeholder="Write your article content here..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="image">Featured Image</label>
                        <div class="image-upload">
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <div class="image-preview" id="imagePreview">
                                <i class="bi bi-image"></i>
                                <p>Upload Image</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tags">Tags</label>
                        <input type="text" class="form-control" id="tags" name="tags" placeholder="Enter tags separated by commas (e.g., tech, coding, javascript)">
                        <small class="form-text">Separate tags with commas</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="status">Status *</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                        
                        <div class="form-group col-md-6">
                            <label for="publishDate">Publish Date</label>
                            <input type="datetime-local" class="form-control" id="publishDate" name="publishDate">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="saveDraftBtn">Save as Draft</button>
                        <button type="submit" class="btn btn-primary">Publish Article</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/script/main.js"></script>
    <script src="/pages/create-article.js"></script>
</body>
</html>
