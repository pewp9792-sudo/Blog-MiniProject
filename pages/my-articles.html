<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Articles - Blog Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="menu-icon" id="menuToggle">
                <i class="bi bi-list"></i>
            </div>
            <div class="sidebar-title">Blog</div>
        </div>

        <div class="admin-label">ADMIN</div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active" id="myArticleLink">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>My Article</span>
                    <i class="bi bi-chevron-down dropdown-icon"></i>
                </a>
                <ul class="sub-menu show" id="articleSubmenu">
                    <li class="nav-item">
                        <a href="my-articles.html" class="nav-link active">All Article</a>
                    </li>
                    <li class="nav-item">
                        <a href="create-article.html" class="nav-link">Create Article</a>
                    </li>
                </ul>
            </li>
            <li class="nav-item">
                <a href="categories.html" class="nav-link">
                    <i class="bi bi-tag"></i>
                    <span>Category</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="profile.html" class="nav-link">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </li>
            <li class="nav-item" style="margin-top: 30px;">
                <a href="#" class="nav-link logout-link" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="page-title">My Articles</div>
            <div class="user-profile" id="userProfile">
                <span class="user-name" id="userName">Loading...</span>
                <div class="user-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <i class="bi bi-chevron-down"></i>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="content-header">
                <h1 class="content-title">All My Articles</h1>
                <a href="create-article.html" class="btn btn-create">
                    <i class="bi bi-plus-lg"></i> Create New Article
                </a>
            </div>

            <table class="table" style="border-radius: 10px; overflow: hidden;">
                <thead class="text-center">
                    <tr class="text-uppercase">
                        <th class="bg-body-secondary fw-bold">Title</th>
                        <th class="bg-body-secondary fw-bold">Category</th>
                        <th class="bg-body-secondary fw-bold">Content</th>
                        <th class="bg-body-secondary fw-bold">Thumbnail</th>
                        <th class="bg-body-secondary fw-bold">Action</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scr/BaseURL.js"></script>
    <script src="../assets/scr/myArticle.js"></script>
</body>
</html>
