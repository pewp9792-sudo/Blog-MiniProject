<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Blog Admin</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .sidebar {
      width: 250px;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100%;
      padding-bottom: 20px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-title {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .nav-menu {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      flex-grow: 1;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: #adb5bd;
      text-decoration: none;
      transition: all 0.2s;
      border-radius: 5px;
      margin: 0 10px 5px 10px;
    }

    .nav-link i {
      margin-right: 10px;
      font-size: 1.1rem;
    }

    .nav-link:hover,
    .nav-link.active {
      background-color: #343a40;
      color: #fff;
    }

    .sub-menu {
      display: none;
      list-style: none;
      padding-left: 40px;
      margin: 5px 0;
    }

    .sub-menu .nav-link {
      padding: 8px 20px;
      font-size: 0.95rem;
    }

    .admin-label {
      padding: 10px 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #6c757d;
    }

    .main-content {
      margin-left: 250px;
      padding: 25px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-avatar {
      font-size: 2rem;
      color: #495057;
    }

    .article-card {
      transition: transform 0.2s, box-shadow 0.2s;
      border-radius: 10px;
      overflow: hidden;
    }

    .article-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .article-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="menu-icon" id="menuToggle">
        <i class="bi bi-list"></i>
      </div>
      <div class="sidebar-title">Blog</div>
    </div>

    <div class="admin-label">ADMIN</div>

    <ul class="nav-menu">
      <li class="nav-item">
        <a href="#" class="nav-link active">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" id="myArticleLink">
          <i class="bi bi-file-earmark-text"></i>
          <span>My Article</span>
          <i class="bi bi-chevron-down dropdown-icon ms-auto"></i>
        </a>
        <ul class="sub-menu" id="articleSubmenu">
          <li class="nav-item">
            <a href="my-articles.html" class="nav-link">All Article</a>
          </li>
          <li class="nav-item">
            <a href="create-article.html" class="nav-link">Create Article</a>
          </li>
        </ul>
      </li>
      <li class="nav-item">
        <a href="categories.html" class="nav-link">
          <i class="bi bi-tag"></i>
          <span>Category</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="profile.html" class="nav-link">
          <i class="bi bi-person"></i>
          <span>Profile</span>
        </a>
      </li>
      <li class="nav-item" style="margin-top: auto;">
        <a href="#" class="nav-link logout-link" id="logoutBtn">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="top-bar">
      <div class="page-title">Dashboard</div>
      <div class="user-profile" id="userProfile">
        <span class="user-name" id="userName">Admin</span>
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <i class="bi bi-chevron-down"></i>
      </div>
    </div>

    <!-- Articles Grid -->
    <div class="row g-4 dashboard-container">
      <!-- Articles will be loaded here by JavaScript -->
    </div>

    <!-- Load More Button -->
    <div class="text-center my-4">
      <button class="btn btn-primary" id="loadMore" style="display: none;">Load More Articles</button>
    </div>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card article-card shadow-sm">
          <img src="https://via.placeholder.com/300x180" alt="Article Image">
          <div class="card-body">
            <h5 class="card-title">Article 4</h5>
            <p class="card-text text-truncate">Content for article 4...</p>
            <div class="d-flex align-items-center mt-3">
              <img src="https://via.placeholder.com/30" class="rounded-circle me-2" alt="author">
              <small class="text-muted">Author 4</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/Js/BaseURL.js"></script>
  <script src="../assets/Js/getProfile.js"></script>
  <script src="../assets/Js/dashboard.js"></script>
  <script src="../assets/Js/logout.js"></script>
  <script>
    // Toggle submenu
    const myArticleLink = document.getElementById('myArticleLink');
    const articleSubmenu = document.getElementById('articleSubmenu');

    myArticleLink.addEventListener('click', (e) => {
      e.preventDefault();
      articleSubmenu.style.display = articleSubmenu.style.display === 'block' ? 'none' : 'block';
    });
  </script>
</body>
</html>
